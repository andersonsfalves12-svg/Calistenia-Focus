<!DOCTYPE html>
<!-- Projeto desenvolvido com auxílio de IA (Claude, da Anthropic). -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="bg-body">

<!-- ================= BARRA SUPERIOR ================= -->
<nav class="navbar bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <span class="navbar-brand">🎯 Calistenia Focus</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-secondary">Olá, <strong th:text="${username}">usuário</strong></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- ================= FORMULÁRIO DO TREINO DO DIA ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Treino do dia</h4>

            <!-- Envia todos os exercícios marcados de uma vez para /dashboard/add-session -->
            <form th:action="@{/dashboard/add-session}" method="post">

                <div class="mb-3 date-field">
                    <label class="form-label" for="date">Data</label>
                    <input type="date" class="form-control" id="date" name="date" th:value="${today}">
                </div>

                <!-- Uma linha para cada exercício do mapa "exercises" (ex.key = chave, ex.value = nome) -->
                <div class="exercise-row border rounded p-3 mb-2" th:each="ex : ${exercises}">
                    <div class="row align-items-center g-2">

                        <div class="col-12 col-md-5">
                            <div class="form-check form-switch">
                                <!-- name="exercises": o servidor recebe a lista das chaves marcadas -->
                                <input class="form-check-input exercise-check" type="checkbox" role="switch"
                                       name="exercises" th:value="${ex.key}" th:id="'chk-' + ${ex.key}">
                                <label class="form-check-label fw-semibold" th:for="'chk-' + ${ex.key}"
                                       th:text="${ex.value}">Exercício</label>
                            </div>
                        </div>

                        <!-- Os campos começam desabilitados; o exercise-form.js os ativa ao marcar o switch.
                             O nome é dinâmico, por exemplo sets_flexoes e reps_flexoes. -->
                        <div class="col-6 col-md-3">
                            <input type="number" class="form-control sets-input" min="1" max="1000"
                                   th:name="'sets_' + ${ex.key}" placeholder="Séries" disabled>
                        </div>
                        <div class="col-6 col-md-3">
                            <input type="number" class="form-control reps-input" min="1" max="1000"
                                   th:name="'reps_' + ${ex.key}" placeholder="Repetições" disabled>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-3">💪 Registrar treino</button>
            </form>
        </div>
    </div>

    <!-- ================= GRÁFICO DE EVOLUÇÃO ================= -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Evolução — volume total por dia</h4>

            <p th:if="${#lists.isEmpty(chartLabels)}" class="text-secondary mb-0">
                Registre seu primeiro treino para ver o gráfico.
            </p>

            <!-- O gráfico é desenhado pelo Chart.js dentro deste canvas -->
            <div class="chart-container" th:unless="${#lists.isEmpty(chartLabels)}">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>
    </div>

    <!-- ================= HISTÓRICO ================= -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Histórico</h4>

            <p th:if="${#lists.isEmpty(logs)}" class="text-secondary mb-0">Nenhum treino registrado ainda.</p>

            <!-- table-responsive: permite rolar a tabela de lado em telas pequenas -->
            <div class="table-responsive" th:unless="${#lists.isEmpty(logs)}">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Data</th>
                        <th>Exercício</th>
                        <th>Séries</th>
                        <th>Repetições</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs}">
                        <td th:text="${#temporals.format(log.date, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${log.exerciseName}">Flexões</td>
                        <td th:text="${log.sets}">3</td>
                        <td th:text="${log.reps}">10</td>
                        <td class="text-end">
                            <!-- Envia POST para /dashboard/delete/{id}. O confirm() pergunta antes de apagar. -->
                            <form th:action="@{/dashboard/delete/{id}(id=${log.id})}" method="post"
                                  onsubmit="return confirm('Excluir este registro?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm">🗑️ Excluir</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<!-- Chart.js: biblioteca que desenha o gráfico -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:src="@{/js/exercise-form.js}"></script>
<script th:src="@{/js/evolution-chart.js}"></script>

<!-- th:inline="javascript" deixa o Thymeleaf inserir as listas do Java direto no JavaScript.
     Os valores depois de /*...*/ são só padrões usados fora do servidor. -->
<script th:inline="javascript">
    drawEvolutionChart(/*[[${chartLabels}]]*/ [], /*[[${chartValues}]]*/ []);
</script>

</body>
</html>
