# ===== Aplicação =====
spring.application.name=calistenia-focus
server.port=8080

# Faz o Spring respeitar os headers X-Forwarded-* do proxy do Codespaces.
# Sem isso, redirecionamentos como redirect:/login podem apontar para "localhost" e quebrar.
server.forward-headers-strategy=framework

# ===== Banco de dados H2 (em memória: os dados somem quando a aplicação reinicia) =====
spring.datasource.url=jdbc:h2:mem:calistenia;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# "update" cria as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
# Mude para true para ver no terminal o SQL que está sendo executado
spring.jpa.show-sql=false

# ===== Thymeleaf =====
# Cache desligado: alterações nos templates aparecem sem reiniciar
spring.thymeleaf.cache=false
