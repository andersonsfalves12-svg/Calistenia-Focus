<!DOCTYPE html>
<!-- Projeto desenvolvido com auxílio de IA (Claude, da Anthropic). -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Cabeçalho comum a todas as páginas. Uso: <head th:replace="~{fragments/layout :: head('Título')}"> -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' - Calistenia Focus'">Calistenia Focus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

<!-- Mensagens de sucesso e erro enviadas pelo controller. Só aparecem se existirem. -->
<div th:fragment="messages">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

</body>
</html>
